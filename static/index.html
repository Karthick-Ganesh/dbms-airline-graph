<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Route Finder · Neo Airways</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="topbar"></header>

  <main class="page">
    <div class="page-header">
      <h1>Route Finder</h1>
      <p>Compare the fastest, greenest and shortest itineraries between two airports, computed with
        GDS Dijkstra, A* and Yen's k-shortest paths on the live (ACTIVE) route network.</p>
    </div>

    <form class="card" id="search">
      <h2>Route search · Boarding pass</h2>
      <div class="search-bar">
        <div class="field-from">
          <label for="from">From</label>
          <input id="from" placeholder="City, airport or code" required>
        </div>
        <button type="button" class="swap" id="swap" aria-label="Swap origin and destination" title="Swap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
        </button>
        <div class="field-to">
          <label for="to">To</label>
          <input id="to" placeholder="City, airport or code" required>
        </div>
        <button class="btn btn-search" id="go">Find routes</button>
      </div>
      <div class="perf"></div>
      <div class="examples">
        <span class="field-label muted">Popular routes</span>
        <span class="chips" id="examples"></span>
      </div>
    </form>

    <div class="split" style="margin-top: var(--space-4)">
      <div id="map" class="map" role="img" aria-label="Map of the route options"></div>
      <section id="results" aria-live="polite">
        <div class="card empty">Pick two airports to print your boarding passes.</div>
      </section>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/map.js"></script>
  <script src="/js/route-finder.js"></script>
</body>
</html>
