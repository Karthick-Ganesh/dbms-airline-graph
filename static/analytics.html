<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics · Neo Airways</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="topbar"></header>

  <main class="page">
    <div class="page-header">
      <h1>Analytics</h1>
      <p>The project's Cypher and GDS queries, run live. Change a parameter and press Run; open
        “Cypher” to see the exact query.</p>
    </div>

    <section class="stats" id="stats" aria-label="Database size"></section>

    <div class="section-label">Network analytics</div>
    <div class="cards" id="featured"></div>

    <div class="section-label">All queries</div>
    <div class="cards" id="others"></div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/analytics.js"></script>
</body>
</html>
